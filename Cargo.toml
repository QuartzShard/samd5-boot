[package]
name = "samd5-boot"
version = "0.1.0"
edition = "2024"

[dependencies]
atsamd-hal = "0.23.4"
bytemuck = { version = "1.25.2", features = ["derive"] }
cortex-m = "0.7.9"
# Trait-only: atsamd-hal's Watchdog::start lives on the eh-0.2 trait,
# which the HAL does not publicly re-export
embedded-hal-02 = { package = "embedded-hal", version = "0.2.7" }

# The BOOT skeleton is a standalone downstream crate under examples/, so it
# carries -rt and the critical-section impl itself; this crate has neither.

[features]
# Chip selection: enable exactly one part feature.
#
# atsamd-hal only carries variant-level features (`samd51j`, ...), which do
# not encode flash/RAM density; `samd51j` covers the J18A/J19A/J20A at
# 256 KiB/512 KiB/1 MiB. Bank geometry in `target_consts` needs the full
# part number, so the features here are part-level and pass through to the
# matching hal variant feature.

# BOOT region size (drives BOOT_SIZE / BOOTPROT_VALUE in `consts`).
# At most one; none selected = 32 KiB. Both downstream binaries must agree;
# the size is frozen per device once BOOT is installed.
# bootprot-16k is invalid on 1 MiB (...20a) parts, whose 32 KiB lock
# regions set a 32 KiB floor; consts.rs rejects that combination.
bootprot-16k = []
bootprot-32k = []
bootprot-64k = []
bootprot-96k = []

# SAMD51G (48-pin)
samd51g18a = ["atsamd-hal/samd51g"]
samd51g19a = ["atsamd-hal/samd51g"]

# SAMD51J (64-pin)
samd51j18a = ["atsamd-hal/samd51j"]
samd51j19a = ["atsamd-hal/samd51j"]
samd51j20a = ["atsamd-hal/samd51j"]

# SAMD51N (100-pin)
samd51n19a = ["atsamd-hal/samd51n"]
samd51n20a = ["atsamd-hal/samd51n"]

# SAMD51P (120/128-pin)
samd51p19a = ["atsamd-hal/samd51p"]
samd51p20a = ["atsamd-hal/samd51p"]

# SAME51G (48-pin)
same51g18a = ["atsamd-hal/same51g"]
same51g19a = ["atsamd-hal/same51g"]

# SAME51J (64-pin)
same51j18a = ["atsamd-hal/same51j"]
same51j19a = ["atsamd-hal/same51j"]
same51j20a = ["atsamd-hal/same51j"]

# SAME51N (100-pin)
same51n19a = ["atsamd-hal/same51n"]
same51n20a = ["atsamd-hal/same51n"]

# SAME53J (64-pin)
same53j18a = ["atsamd-hal/same53j"]
same53j19a = ["atsamd-hal/same53j"]
same53j20a = ["atsamd-hal/same53j"]

# SAME53N (100-pin)
same53n19a = ["atsamd-hal/same53n"]
same53n20a = ["atsamd-hal/same53n"]

# SAME54N (100-pin)
same54n19a = ["atsamd-hal/same54n"]
same54n20a = ["atsamd-hal/same54n"]

# SAME54P (120/128-pin)
same54p19a = ["atsamd-hal/same54p"]
same54p20a = ["atsamd-hal/same54p"]

[package.metadata.docs.rs]
features = ["samd51j20a"]
