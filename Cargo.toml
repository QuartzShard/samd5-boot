[package]
name = "samd5-boot"
version = "1.0.0"
edition = "2024"
# The floor, not a recommendation: let-chains under edition 2024 and
# `slice::as_chunks` both landed in 1.88, and nothing here needs more. Firmware
# work pins toolchains for reproducible builds, so a higher floor would lock
# out this crate's own audience for no gain.
rust-version = "1.88"
license = "MPL-2.0"
description = "A bank-swapping A:B bootloader for ATSAMD/E5x microcontrollers."
repository = "https://github.com/QuartzShard/samd5-boot"
keywords = ["bootloader", "firmware-update", "ota", "samd51", "cortex-m"]
categories = ["embedded", "no-std", "hardware-support"]
exclude = ["xtask", "examples", "scripts"]

[dependencies]
# Optional so the crate builds for a host without them: `--no-default-features`
# drops the `target` feature and leaves the flash ABI (consts, manifest,
# boot_info, crc32, the persist record types) compiling anywhere, which is what
# lets `xtask` share one definition of that ABI with the firmware.
atsamd-hal = { version = "0.23.4", optional = true }
bytemuck = { version = "1.25.2", features = ["derive"] }
cortex-m = { version = "0.7.9", optional = true }
# Trait-only: atsamd-hal's Watchdog::start lives on the eh-0.2 trait,
# which the HAL does not publicly re-export
embedded-hal-02 = { package = "embedded-hal", version = "0.2.7", optional = true }

# The BOOT skeleton is a standalone downstream crate under examples/, so it
# carries -rt and the critical-section impl itself; this crate has neither.

[features]
# Nothing by default, so a plain dependency is the host-buildable flash ABI and
# no driver: that is what host tooling wants, and it is the configuration
# `cargo publish` verifies. Firmware picks a part instead, and a part brings
# `target` with it, so a downstream binary never names both.
default = []
# Everything that drives the silicon. Off, the crate exposes only the layouts
# and formulas the ABI is made of.
target = ["dep:atsamd-hal", "dep:cortex-m", "dep:embedded-hal-02"]

# Chip selection: enable exactly one part feature.
#
# atsamd-hal only carries variant-level features (`samd51j`, ...), which do
# not encode flash/RAM density; `samd51j` covers the J18A/J19A/J20A at
# 256 KiB/512 KiB/1 MiB. Bank geometry in `target_consts` needs the full
# part number, so the features here are part-level and pass through to the
# matching hal variant feature.

# BOOT region size (drives BOOT_SIZE / BOOTPROT_VALUE in `consts`).
# At most one; none selected = 32 KiB. Both downstream binaries must agree;
# the size is frozen per device once BOOT is installed.
# bootprot-16k is invalid on 1 MiB (...20a) parts, whose 32 KiB lock
# regions set a 32 KiB floor; consts.rs rejects that combination.
bootprot-16k = []
bootprot-32k = []
bootprot-64k = []
bootprot-96k = []

# SAMD51G (48-pin)
samd51g18a = ["target", "atsamd-hal/samd51g"]
samd51g19a = ["target", "atsamd-hal/samd51g"]

# SAMD51J (64-pin)
samd51j18a = ["target", "atsamd-hal/samd51j"]
samd51j19a = ["target", "atsamd-hal/samd51j"]
samd51j20a = ["target", "atsamd-hal/samd51j"]

# SAMD51N (100-pin)
samd51n19a = ["target", "atsamd-hal/samd51n"]
samd51n20a = ["target", "atsamd-hal/samd51n"]

# SAMD51P (120/128-pin)
samd51p19a = ["target", "atsamd-hal/samd51p"]
samd51p20a = ["target", "atsamd-hal/samd51p"]

# SAME51G (48-pin)
same51g18a = ["target", "atsamd-hal/same51g"]
same51g19a = ["target", "atsamd-hal/same51g"]

# SAME51J (64-pin)
same51j18a = ["target", "atsamd-hal/same51j"]
same51j19a = ["target", "atsamd-hal/same51j"]
same51j20a = ["target", "atsamd-hal/same51j"]

# SAME51N (100-pin)
same51n19a = ["target", "atsamd-hal/same51n"]
same51n20a = ["target", "atsamd-hal/same51n"]

# SAME53J (64-pin)
same53j18a = ["target", "atsamd-hal/same53j"]
same53j19a = ["target", "atsamd-hal/same53j"]
same53j20a = ["target", "atsamd-hal/same53j"]

# SAME53N (100-pin)
same53n19a = ["target", "atsamd-hal/same53n"]
same53n20a = ["target", "atsamd-hal/same53n"]

# SAME54N (100-pin)
same54n19a = ["target", "atsamd-hal/same54n"]
same54n20a = ["target", "atsamd-hal/same54n"]

# SAME54P (120/128-pin)
same54p19a = ["target", "atsamd-hal/same54p"]
same54p20a = ["target", "atsamd-hal/same54p"]

[package.metadata.docs.rs]
features = ["samd51j20a"]
