[package]
name = "manifest-tool"
version = "0.1.0"
edition = "2024"
description = "Host-side post-linker: stamps a samd5-boot AppManifest (magic, version, image_len, dual zlib CRC-32) into a linked app image so it passes bootloader verification."
publish = false

# Standalone by design: NOT a member of any workspace, and no dependency on
# the embedded `samd5-boot` crate (which is no_std, no_main, and needs a chip
# feature to compile). The manifest layout and CRC convention are mirrored
# here and pinned by tests, so a host build never drags in the target crate.
[workspace]

[[bin]]
name = "manifest-tool"
path = "src/main.rs"

[dependencies]
